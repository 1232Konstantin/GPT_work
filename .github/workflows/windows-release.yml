name: Windows installer
on:
  push:
    branches:
      - main
      - v0.9-development
      - v0.10-development
    tags:
      - 'v*'
  workflow_dispatch:
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install native build tools
        shell: pwsh
        run: |
          choco install tesseract innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed: $LASTEXITCODE" }
      - name: Build, verify offline OCR, compile installer
        shell: pwsh
        run: ./tools/package_windows.ps1
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaOfflineTranslator-Windows-Setup
          path: release/MangaOfflineTranslator_Setup_*_win64.exe
          if-no-files-found: error
      - name: Publish GitHub Release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/MangaOfflineTranslator_Setup_*_win64.exe | Select-Object -First 1
          if (-not $setup) { throw 'No setup file for release' }
          gh release create "${{ github.ref_name }}" $setup.FullName --title "Manga Offline Translator ${{ github.ref_name }}" --notes "Windows x64 installer with Qt, OCR engine and Japanese models. Offline after installation." --verify-tag
      - name: Publish v0.9 preview from development branch
        if: github.ref == 'refs/heads/v0.9-development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.9.0-preview.1'
          $setup = Get-ChildItem release/MangaOfflineTranslator_Setup_0.9.0_win64.exe | Select-Object -First 1
          if (-not $setup) { throw 'No v0.9 installer' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName --clobber
          } else {
            gh release create $tag $setup.FullName --target "$env:GITHUB_SHA" --title 'Manga Offline Translator 0.9.0 preview' --notes 'Three editor modes; independent image/text Undo/Redo; flat-background cleanup for small selections; mouse-driven cleanup and text rectangles.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'v0.9 preview release publication failed' }
      - name: Publish v0.10 preview from development branch
        if: github.ref == 'refs/heads/v0.10-development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.10.0-preview.3'
          $setup = Get-ChildItem release/MangaOfflineTranslator_Setup_0.10.0_win64.exe | Select-Object -First 1
          if (-not $setup) { throw 'No v0.10 installer' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName --clobber
          } else {
            gh release create $tag $setup.FullName --target "$env:GITHUB_SHA" --title 'Manga Offline Translator 0.10.0 preview.3' --notes '0.10 corrective preview: cleanup again recognizes lettering after painting, text edits and Undo/Redo; picker preview and click use the same pixel; up to 50 compressed Undo steps. Enter still adds a line; Ctrl+Enter applies text. All earlier v0.10 features retained.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'v0.10 preview release publication failed' }
      - name: Publish preview installer on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.8.0-preview.1'
          $setup = Get-ChildItem release/MangaOfflineTranslator_Setup_*_win64.exe | Select-Object -First 1
          if (-not $setup) { throw 'No setup file for preview release' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName --clobber
          } else {
            gh release create $tag $setup.FullName --target "$env:GITHUB_SHA" --title 'Manga Offline Translator 0.8.0 (editor workflow and UI correction)'  --notes 'Reworked UI modes: separate clipboard selection and text cleanup, clean selection reset between regions, movable/resizable text boxes with Undo/Redo, functional context image clipboard, dark theme and readable toolbar icons, visible zoom, optimized background thumbnails. Includes Qt mouse-driven workflow tests.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Preview release publication failed' }